<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprechprüfung Trainer · Goethe A1</title>
<style>
:root{
  --bg:#efe7d7;
  --paper:#f7f0e3;
  --card:#e8c63d;
  --card-deep:#ddb82f;
  --ink:#1f1a17;
  --muted:#847a6d;
  --line:#cabda8;
  --white:#fffdf8;
  --soft:#f5eee0;
  --accent:#c9503b;
  --shadow:0 10px 25px rgba(53,38,15,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: "Avenir Next", "Segoe UI", Inter, system-ui, sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1280px;margin:0 auto;padding:28px 22px 46px}
.top{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
.logo{
  width:84px;height:84px;border-radius:999px;border:4px solid var(--accent);
  display:grid;place-items:center;color:var(--accent);font-weight:900;font-size:30px;
  background:rgba(255,255,255,.18);flex:0 0 auto; box-shadow: inset 0 0 0 8px rgba(201,80,59,.08);
}
.title-block h1{
  margin:0 0 6px;
  font-size: clamp(32px, 4vw, 58px);
  line-height:1;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing:-.03em;
  font-weight:900;
}
.subtitle{
  color:var(--muted);
  font-size:clamp(18px,1.7vw,20px);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.theme-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 22px}
.theme-chip{
  border:2px solid var(--line);background:var(--soft);color:#4d443c;border-radius:999px;
  padding:12px 18px;font-size:18px;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.theme-chip:hover{transform:translateY(-1px)}
.theme-chip.active{background:#241b15;color:#fff4e6;border-color:#241b15}
.round-btn{
  margin-left:auto;border:2px dashed var(--accent);background:transparent;color:var(--accent);
  border-radius:999px;padding:12px 18px;font-size:18px;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.feedback-box{
  min-height:136px;border:2px solid #d4a33b;border-radius:18px;background:rgba(255,248,227,.45);
  padding:20px 22px;margin:0 0 24px;box-shadow:0 2px 0 rgba(255,255,255,.35) inset;
}
.feedback-title{
  font-size:18px;color:#81735f;text-transform:uppercase;letter-spacing:.12em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-bottom:12px;
}
.feedback-body{font-size:18px;line-height:1.6;white-space:pre-line}
.feedback-body strong{display:block;margin-top:8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.segment{display:inline-flex;border:2px solid var(--line);background:var(--soft);border-radius:999px;overflow:hidden;padding:0}
.segment button{
  border:0;background:transparent;padding:14px 26px;font-size:18px;color:#51483f;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.segment button.active{background:#241b15;color:#fff4e6}
.right-tools{display:flex;align-items:center;gap:14px;margin-left:auto}
.counter{color:var(--muted);font-size:17px;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.note-card{
  position:relative;background:var(--card);border-radius:18px;min-height:300px;padding:22px 22px 18px;
  box-shadow:var(--shadow);transition:transform .16s ease, box-shadow .16s ease;
  border:1px solid rgba(74,55,7,.08);overflow:hidden;
  display:flex;flex-direction:column;
}
.note-card:hover{transform:translateY(-2px) rotate(0deg)!important;box-shadow:0 14px 30px rgba(53,38,15,.14)}
.note-card.active{outline:3px solid rgba(36,27,21,.16)}
.hole{
  position:absolute;left:14px;top:14px;width:22px;height:22px;border-radius:50%;
  background:#f8f1d3;border:3px solid rgba(109,87,19,.45);
}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-left:26px;margin-bottom:10px}
.card-theme{
  color:#8b7632;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.version-dots{display:flex;gap:8px;flex:0 0 auto}
.vdot{
  width:28px;height:28px;border-radius:999px;border:2px solid rgba(75,60,20,.35);
  background:transparent;color:#7b661f;font-weight:900;font-size:14px;display:grid;place-items:center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.vdot.active{background:#1f1a17;color:#fff4e6;border-color:#1f1a17}
.card-word{font-size:20px;font-weight:800;margin:8px 0 10px}
.card-question{font-size:18px;font-weight:900;line-height:1.35;margin:0 0 4px}
.card-english{font-size:15px;color:#55482c;font-style:italic;opacity:.9;margin-bottom:18px;line-height:1.4}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:14px}
.practice-link{
  border:0;background:transparent;padding:0;color:#8a732a;font-size:15px;font-weight:700;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.peek-btn{border:0;background:rgba(255,255,255,.38);padding:9px 13px;border-radius:999px;font-size:14px;color:#4d3b16;white-space:nowrap}
.answer-preview{margin:2px 0 2px;padding:12px;border-radius:15px;background:rgba(255,248,227,.52);display:none;font-size:15px;line-height:1.45}
.answer-preview.show{display:block}
.answer-toggle{display:inline-flex;border:1.5px solid rgba(88,69,21,.24);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);margin-bottom:10px}
.answer-toggle button{border:0;background:transparent;padding:7px 15px;font-size:14px;font-weight:800;color:#6e581d;min-width:62px}
.answer-toggle button.active{background:#241b15;color:#fff4e6}
.answer-text{min-height:44px;color:#2d261c;font-size:15px;line-height:1.45;padding:1px 2px}
.answer-label{display:inline-block;margin-bottom:8px;font-size:13px;font-weight:900;color:#6e581d;text-transform:uppercase;letter-spacing:.06em}
.practice-shell{display:none}
.practice-shell.active{display:block}
.practice-card{
  background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);position:relative;margin-bottom:18px;
}
.practice-card .hole{left:18px;top:18px}
.practice-meta{padding-left:30px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.practice-word{font-size:30px;font-weight:900;margin:8px 0 10px}
.practice-q{font-size:34px;line-height:1.2;font-weight:900;margin:0 0 6px}
.practice-en{font-size:18px;font-style:italic;color:#574926;margin-bottom:18px}
.answer-type{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.answer-type button{border:2px solid rgba(75,60,20,.28);background:rgba(255,255,255,.28);border-radius:999px;padding:10px 14px;font-size:16px}
.answer-type button.active{background:#241b15;color:#fff4e6;border-color:#241b15}
.input-row{display:flex;gap:12px;align-items:stretch}
.input-row input{flex:1;min-width:0;padding:16px 18px;border-radius:16px;border:2px solid #d3b05b;background:#fffaf0;font-size:18px}
.input-row input:focus{outline:none;border-color:#6c5320}
.primary{border:0;background:#241b15;color:#fff4e6;border-radius:16px;padding:0 22px;font-weight:900;min-width:140px}
.practice-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.navs{display:flex;gap:10px}
.navs button,.speak-btn{border:2px solid var(--line);background:var(--soft);border-radius:999px;padding:10px 16px;font-size:16px}
.hidden{display:none!important}
.footer-tip{margin-top:14px;color:var(--muted);font-size:15px}
@media (max-width:1080px){
  .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:740px){
  .app{padding:22px 14px 38px}
  .cards-grid{grid-template-columns:1fr}
  .round-btn{margin-left:0}
  .input-row{flex-direction:column}
  .primary{min-height:52px}
  .practice-q{font-size:28px}
  .title-block h1{font-size:38px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">A1</div>
    <div class="title-block">
      <h1>Sprechprüfung Trainer</h1>
      <div class="subtitle">Goethe A1 · W-Fragen &amp; Thema</div>
    </div>
  </div>

  <div class="theme-bar" id="themeBar"></div>

  <div class="feedback-box">
    <div class="feedback-title">Korrigiert</div>
    <div class="feedback-body" id="feedbackBox">Noch nichts geprüft. Wähle eine Karte und tippe deine Antwort.</div>
  </div>

  <div class="toolbar">
    <div class="segment" id="modeSeg">
      <button data-mode="cards" class="active">Karten</button>
      <button data-mode="practice">Übung</button>
    </div>
    <div class="right-tools">
      <div class="counter" id="counter"></div>
      <div class="segment" id="formSeg">
        <button data-form="Du">Du</button>
        <button data-form="Sie" class="active">Sie</button>
      </div>
    </div>
  </div>

  <section id="cardsView">
    <div class="cards-grid" id="cardsGrid"></div>
  </section>

  <section class="practice-shell" id="practiceView">
    <div class="practice-card" id="practiceCard">
      <div class="hole"></div>
      <div class="practice-meta">
        <div>
          <div class="card-theme" id="pTheme"></div>
          <div class="practice-word" id="pWord"></div>
        </div>
        <div class="version-dots" id="practiceDots"></div>
      </div>
      <div class="practice-q" id="pQuestion"></div>
      <div class="practice-en" id="pEnglish"></div>
      <div class="answer-type" id="responseChoice">
        <button data-answer="yes" class="active">Antwort / Ja</button>
        <button data-answer="no">Nein</button>
      </div>
      <div class="input-row">
        <input id="answerInput" autocomplete="off" placeholder="Tippen Sie Ihre Antwort hier...">
        <button class="primary" id="checkBtn">Prüfen</button>
      </div>
      <div class="practice-actions">
        <div class="navs">
          <button id="prevBtn">← Zurück</button>
          <button id="nextBtn">Weiter →</button>
          <button id="shuffleBtn">↻ Mischen</button>
        </div>
        <button class="speak-btn" id="speakBtn">🔊 Vorlesen</button>
      </div>
    </div>
    <div class="footer-tip">Tipp: Version 1 und 2 sind W-Fragen. Version 3 ist eine Ja/Nein-Frage mit Ja- und Nein-Antwort.</div>
  </section>
</div>

  const html = THEMES.map(t=>`<button class="theme-chip ${t===state.theme?'active':''}" data-theme="${t}">${t}</button>`).join('') +
    `<button class="round-btn" id="newRoundBtn">+ Neue Runde</button>`;
  $('#themeBar').innerHTML = html;
  $$('#themeBar .theme-chip').forEach(btn=>btn.onclick=()=>{state.theme=btn.dataset.theme;state.selected=0;state.expected='yes';state.order=[];render()});
  $('#newRoundBtn').onclick = ()=>newRound();
}

function cardHTML(globalIdx,pos){
  const c=getCard(globalIdx), v=getVersion(globalIdx), vr=c.variants[v];
  const rot = ROTATIONS[pos % ROTATIONS.length];
  const reveal = !!state.reveal[globalIdx];
  return `
  <article class="note-card ${globalIdx===currentGlobalIndex()?'active':''}" data-id="${globalIdx}" style="transform:rotate(${rot}deg)">
    <div class="hole"></div>
    <div class="card-head">
      <div class="card-theme">${c.theme.toUpperCase()}</div>
      <div class="version-dots">
        ${[0,1,2].map(n=>`<button class="vdot ${n===v?'active':''}" data-id="${globalIdx}" data-v="${n}">${n+1}</button>`).join('')}
      </div>
    </div>
    <div class="card-word">${c.word}</div>
    <div class="card-question">${vr.q[state.form]}</div>
    <div class="card-english">${vr.en || c.en || ''}</div>
    <div class="answer-preview ${reveal?'show':''}" id="preview-${globalIdx}">
      ${vr.type==='YN' ? `
      <div class="answer-toggle" role="group" aria-label="Antwort auswählen">
        <button class="${(state.answerView[globalIdx]||'yes')==='yes'?'active':''}" data-answer-view="yes" data-id="${globalIdx}">Ja</button>
        <button class="${(state.answerView[globalIdx]||'yes')==='no'?'active':''}" data-answer-view="no" data-id="${globalIdx}">Nein</button>
      </div>` : `<div class="answer-label">Antwort</div>`}
      <div class="answer-text">${vr.type==='YN' ? ((state.answerView[globalIdx]||'yes')==='yes' ? vr.a[state.form] : vr.n[state.form]) : vr.a[state.form]}</div>
    </div>
    <div class="card-bottom">
      <button class="practice-link" data-open-practice="${globalIdx}">Tippen für Antwort ›</button>
      <button class="peek-btn" data-peek="${globalIdx}">${reveal?'Antwort ausblenden':'Antwort zeigen'}</button>
    </div>
  </article>`;
}
function renderCards(){
  const ids=themeIndexes();
  $('#cardsGrid').innerHTML = ids.map((id,idx)=>cardHTML(id,idx)).join('');
  $$('#cardsGrid .vdot').forEach(btn=>btn.onclick=(e)=>{ e.stopPropagation(); setVersion(+btn.dataset.id,+btn.dataset.v); renderCards(); if(state.mode==='practice' && +btn.dataset.id===currentGlobalIndex()) renderPractice(); });
  $$('#cardsGrid [data-open-practice]').forEach(btn=>btn.onclick=()=>{ const id=+btn.dataset.openPractice; state.selected=themeIndexes().indexOf(id); state.mode='practice'; render(); });
  $$('#cardsGrid [data-peek]').forEach(btn=>btn.onclick=()=>{ const id=+btn.dataset.peek; state.reveal[id]=!state.reveal[id]; if(!state.answerView[id]) state.answerView[id]='yes'; renderCards(); });
  $$('#cardsGrid [data-answer-view]').forEach(btn=>btn.onclick=(e)=>{ e.stopPropagation(); const id=+btn.dataset.id; state.answerView[id]=btn.dataset.answerView; state.reveal[id]=true; renderCards(); });
  $$('#cardsGrid .note-card').forEach(card=>card.onclick=(e)=>{ if(e.target.closest('button')) return; const id=+card.dataset.id; state.selected=themeIndexes().indexOf(id); renderCards(); updateCounter(); });
}

function renderPractice(){
  const id=currentGlobalIndex();
  const c=getCard(id); const v=getVersion(id); const vr=c.variants[v];
  $('#pTheme').textContent=c.theme;
  $('#pWord').textContent=c.word;
  $('#pQuestion').textContent=vr.q[state.form];
  $('#pEnglish').textContent=vr.en || c.en || '';
  $('#answerInput').value='';
  $('#practiceDots').innerHTML=[0,1,2].map(n=>`<button class="vdot ${n===v?'active':''}" data-v="${n}">${n+1}</button>`).join('');
  $$('#practiceDots .vdot').forEach(btn=>btn.onclick=()=>{ setVersion(id,+btn.dataset.v); renderPractice(); renderCards(); });
  if(vr.type==='YN'){
    $('#responseChoice').style.display='flex';
    $$('#responseChoice button').forEach(btn=>btn.classList.toggle('active', btn.dataset.answer===state.expected));
  } else {
    state.expected='yes';
    $('#responseChoice').style.display='none';
  }
}

function setMode(mode){state.mode=mode; render()}
function renderSegments(){
  $$('#modeSeg button').forEach(btn=>btn.classList.toggle('active', btn.dataset.mode===state.mode));
  $$('#formSeg button').forEach(btn=>btn.classList.toggle('active', btn.dataset.form===state.form));
}
function render(){
  renderThemeBar(); renderSegments(); updateCounter();
  $('#cardsView').classList.toggle('hidden', state.mode!=='cards');
  $('#practiceView').classList.toggle('active', state.mode==='practice');
  renderCards();
  if(state.mode==='practice') renderPractice();
}
function next(delta){
  const n=themeIndexes().length; if(!n) return;
  state.selected=(state.selected+delta+n)%n;
  render();
}
function newRound(){
  const ids=CARDS.map((c,i)=>[c,i]).filter(([c])=>c.theme===state.theme).map(([,i])=>i);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  state.order=ids;
  state.selected=0;
  ids.forEach(id=>state.versions[id]=Math.floor(Math.random()*3));
  state.expected=Math.random()<.5?'yes':'no';
  $('#feedbackBox').innerHTML='Neue Runde gestartet. Die Karten wurden gemischt und die Versionen neu gesetzt.';
  render();
}

$('#modeSeg').onclick=(e)=>{ if(e.target.dataset.mode) setMode(e.target.dataset.mode); };
$('#formSeg').onclick=(e)=>{ if(e.target.dataset.form){ state.form=e.target.dataset.form; render(); } };
$('#responseChoice').onclick=(e)=>{ if(e.target.dataset.answer){ state.expected=e.target.dataset.answer; renderPractice(); } };
$('#prevBtn').onclick=()=>next(-1);
$('#nextBtn').onclick=()=>next(1);
$('#shuffleBtn').onclick=()=>newRound();
$('#checkBtn').onclick=()=>{
  const id=currentGlobalIndex(); const vr=currentVariant(id); const model=(vr.type==='YN' && state.expected==='no' ? vr.n : vr.a)[state.form];
  const input=$('#answerInput').value.trim();
  if(!input){ $('#feedbackBox').innerHTML='Bitte schreibe zuerst eine Antwort.'; return; }
  const score=similarity(input, model);
  const hints=caseHints(input, model);
  const good=score>=0.62;
  let lines=[];
  lines.push(good ? '✓ Gut! Deine Antwort passt.' : 'Fast. Vergleiche mit der Modellantwort.');
  if(hints.length){ lines.push(''); lines.push('Kleine Korrekturen:'); lines = lines.concat(hints); }
  lines.push('');
  lines.push('Modellantwort:');
  lines.push(model);
  $('#feedbackBox').innerHTML = lines.map((x,i)=> i===0 ? `<strong>${x}</strong>` : x).join('<br>');
};
$('#answerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#checkBtn').click(); });
$('#speakBtn').onclick=()=>{
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance($('#pQuestion').textContent); u.lang='de-DE'; u.rate=.88; speechSynthesis.cancel(); speechSynthesis.speak(u);
};
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight') next(1);
  if(e.key==='ArrowLeft') next(-1);
  if(['1','2','3'].includes(e.key) && state.mode==='practice'){ setVersion(currentGlobalIndex(), +e.key - 1); render(); }
});
render();
</script>
</body>
</html>
